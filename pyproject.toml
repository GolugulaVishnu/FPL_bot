[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fplbot"
version = "0.1.0"
description = "Autonomous Fantasy Premier League bot (runs on the owner's own machines)"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "keyring>=24",
  "tzdata>=2024.1",  # Windows has no system time-zone database for zoneinfo
  "numpy>=1.26",
  "scipy>=1.11",     # MILP solver (HiGHS) for squad selection
]

[project.optional-dependencies]
dev = ["pytest>=8"]
record = ["playwright>=1.45"]  # fplbot record: drives a real browser window

[project.scripts]
fplbot = "fplbot.cli:main"

[tool.setuptools.packages.find]
include = ["fplbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
